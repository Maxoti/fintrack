name: Deploy API to cPanel

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    # Only deploy when CI passed on main
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      BASE: https://${{ secrets.CPANEL_HOST }}:2083/execute
      AUTH: "cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}"
    steps:
      - name: Pull latest main on the cPanel repository
        run: |
          curl -fsS -G "$BASE/VersionControl/update" \
            -H "Authorization: $AUTH" \
            --data-urlencode "repository_root=${{ secrets.CPANEL_REPO_PATH }}" \
            --data-urlencode "branch=main" | tee update.json
          jq -e '(.status // .result.status) == 1' update.json

      - name: Run .cpanel.yml deployment
        run: |
          curl -fsS -G "$BASE/VersionControlDeployment/create" \
            -H "Authorization: $AUTH" \
            --data-urlencode "repository_root=${{ secrets.CPANEL_REPO_PATH }}" | tee deploy.json
          jq -e '(.status // .result.status) == 1' deploy.json

      - name: Wait for the API to come back healthy
        run: |
          # The deployment runs asynchronously on the server (install and build take a while)
          for i in $(seq 1 18); do
            if curl -fsS "${{ vars.API_HEALTH_URL }}" | grep -q '"status":"ok"'; then
              echo "API is healthy"; exit 0
            fi
            echo "Attempt $i: not ready yet"; sleep 10
          done
          echo "API did not become healthy in time"; exit 1